name: mephisto
description: "Mephisto 叙事引擎——在契约框架内驱动命运持续推进的 AI 叙事应用。"
publish_to: "none"
license: MIT

version: 1.4.2+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.2
  equatable: ^2.1.0
  http: ^1.6.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.0.0
  file_selector: ^1.0.3
  path: ^1.9.0
  path_provider: ^2.1.5
  meta: ^1.18.0
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  build_runner: ^2.15.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    # 顶级单角色契约模板（faust.meph / dantes.meph 等）
    - assets/contracts/
    # 内置舞台（多角色）子目录：Flutter assets 目录声明不递归，
    # 需显式列出舞台子目录才能通过 rootBundle 加载舞台角色文件
    - assets/contracts/Kurukshetra/
    - assets/contracts/Camlann/
    - assets/contracts/Lundao/
    # 品牌图标 / Logo
    - assets/images/
    # README 界面预览截图
    - assets/screenshots/
  fonts:
    - family: NotoSerifSc
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerifSC-Bold.ttf
          weight: 700
