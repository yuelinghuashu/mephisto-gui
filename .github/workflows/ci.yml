name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 固定 Flutter 版本（与本地/生成 golden 的版本一致）：golden 像素测试
      # 对 Flutter 版本敏感（文本度量微移即越 0.1% 阈值），channel: stable 会
      # 追最新稳定版导致 golden 偶发失败。升级 Flutter 后需重新生成 golden：
      #   flutter test --update-goldens test/widgets/component_golden_test.dart
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      # 本地化键一致性：zh/en .arb 键集合必须一致，防止漏翻导致运行期崩溃
      - name: Validate l10n keys
        run: python3 tool/validate_l10n.py

      - name: Run tests
        run: flutter test

  # 覆盖率仪表盘：不设硬性门槛（避免 flaky），仅在日志输出摘要
  # 便于观察核心文件覆盖趋势；后续可按需加 --fail-below 硬门槛
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 固定 Flutter 版本（与 analyze-and-test 一致，golden 版本敏感）
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Print coverage summary
        run: python3 tool/coverage_summary.py
