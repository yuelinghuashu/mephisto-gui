name: mephisto
description: "Mephisto 叙事引擎——在契约框架内驱动命运持续推进的 AI 叙事应用。"
publish_to: "none"
license: MIT

version: 1.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.2
  equatable: ^2.1.0
  http: ^1.6.0
  shared_preferences: ^2.5.3
  file_selector: ^1.0.3
  path_provider: ^2.1.5
  meta: ^1.18.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/contracts/
    - assets/images/
  fonts:
    - family: NotoSerifSc
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSerifSC-Bold.ttf
          weight: 700