name: CI

on:
  push:
    branches: [main, master]
    # 仅修改 README / CHANGELOG / docs / LICENSE 时跳过 CI（纯文档提交，无需构建验证）
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
    # 同上：纯文档变更不触发 CI
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'LICENSE'
jobs:
  validate-build-config:
    name: Validate Build Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows (actionlint)
        uses: reviewdog/action-actionlint@v1
        with:
          fail_on_error: true

      - name: Validate Android / iOS / packaging configs
        run: python3 tool/validate_build_config.py

  analyze-and-test:
    name: Flutter Analyze & Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
        shell: bash

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test