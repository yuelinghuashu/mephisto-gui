name: CI

on:
  push:
    branches: [main, master]
    # 仅修改 README / CHANGELOG / docs / LICENSE 时跳过 CI（纯文档提交，无需构建验证）
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
    # 同上：纯文档变更不触发 CI
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'LICENSE'
jobs:
  validate-build-config:
    name: Validate Build Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows (actionlint)
        uses: reviewdog/action-actionlint@v1
        with:
          fail_on_error: true

      - name: Validate Android / iOS / packaging configs
        run: python3 tool/validate_build_config.py

  analyze-and-test:
    name: Flutter Analyze & Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
        shell: bash

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # ============================================================
  # macOS / iOS 构建验证（编译层面）
  # ============================================================
  # 每次 push/PR 都尝试验证 macOS 与 iOS 的编译，防止平台级
  # 编译错误在发布时才被发现。README 此前标注「macOS/iOS 从未
  # 编译运行」——本 job 是第一步（先确认能编译），
  # 真机运行验证仍需人工（无 Apple 开发者证书/真机条件）。
  build-macos-ios:
    name: Build macOS & iOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS (Release)
        run: flutter build macos --release -t lib/app/main.dart

      - name: Build iOS (Release, no codesign)
        run: flutter build ios --release --no-codesign -t lib/app/main.dart
